name: Deploy SSC Psychology Chatbot

on:
  workflow_dispatch: # Manual trigger only

env:
  PROJECT_ID: ssc-psych-chatbot
  IMAGE_NAME: ssc-psych-chatbot-ui

# CI builds and pushes the image only. The Container App deploy runs locally
# (az deployment group create with infrastructure/ssc-psych-chatbot.bicepparam)
# because no service principal with RG permissions exists — same pattern as VAX.
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Azure Container Registry
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SSC_PSYCH_CHATBOT_ACR_LOGIN_SERVER }}
          username: ${{ secrets.SSC_PSYCH_CHATBOT_ACR_USERNAME }}
          password: ${{ secrets.SSC_PSYCH_CHATBOT_ACR_PASSWORD }}

      # Step 4: Build and push Docker image with project-specific configuration
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_PROJECT_ID=${{ env.PROJECT_ID }}
            NEXT_PUBLIC_SIDEBAR_VIEW_ACCESS=false
          tags: |
            ${{ secrets.SSC_PSYCH_CHATBOT_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.SSC_PSYCH_CHATBOT_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Image pushed successfully
        run: |
          echo "✅ Image pushed to ${{ secrets.SSC_PSYCH_CHATBOT_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
